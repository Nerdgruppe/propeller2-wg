# Real-hardware regression expectations; see smart-pin-results.yaml.
test-cases:
- name: Smart pin WXPIN -> RQPIN, gap 0
  prepare: |
    DIRL 40
    WRPIN 2, 40
    DIRH 40
    WXPIN 0, 40
    WAITX 32
  measure: |
    WXPIN 0x155, 40
    RQPIN rt_result, 40
  expect_result: 0
- name: Smart pin WXPIN -> RQPIN, gap 2
