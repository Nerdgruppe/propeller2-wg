- name: Smart pin repository ignores WXPIN during reset
  prepare: |
    DIRL 40
    WRPIN 2, 40
    DIRH 40
    WXPIN 0, 40
    WAITX 32
    WXPIN 0x155, 40
    WAITX 32
    DIRL 40
    WAITX 32
  measure: |
    WXPIN 0x0aa, 40
    WAITX 32
    RQPIN rt_result, 40
  expect_result: 341
- name: Smart pin collision cog 1, offset -2
  prepare: |
    DIRL 40
    WRPIN 2, 40
    DIRH 40
    WXPIN 0, 40
    WAITX 32
    MOV PTRA, aug(hubaddr(mailbox))
    WRLONG 0, PTRA
    SETQ PTRA
    COGINIT 1, aug(hubaddr(worker))
  measure: |
    GETCT target
    ADD target, aug(2048)
    ANDN target, 7
    WRLONG target, PTRA
    ADDCT1 target, aug(-2)
    WAITCT1
    WXPIN 0x155, 40
    WAITX 128
    RQPIN rt_result, 40
  data: |
    var target: LONG 0
    .data
    mailbox: LONG 0
    .cogexec 0x4000, 0
    worker:
     RDLONG register(300), PTRA
     CMP register(300), 0 :wz
     if(Z) JMP worker
     ADDCT1 register(300), 0
     WAITCT1
     WXPIN 0x0aa, 40
     COGSTOP 1
     LONG [0] * 490
    .data
  expect_result: 170
